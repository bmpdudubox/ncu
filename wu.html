<script>
// Capture the page-open time in Beijing. This uses the visitor's device clock.
function formatBeijingTime(date) {
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
  }).formatToParts(date);
  const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
  return `${values.year}-${values.month}-${values.day} ${values.hour}:${values.minute}:${values.second}`;
}

function stampPageOpenTime() {
  const timestamp = formatBeijingTime(new Date());
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="260" height="258"><g transform="translate(41 83) rotate(-24)" fill="#64ad96" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23"><text>赣LA65959</text><text y="31" font-size="21">${timestamp}</text></g></svg>`;
  const marks = document.querySelector('.marks');
  marks.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  marks.dataset.openedAtBeijing = timestamp;
}

stampPageOpenTime();
// A repeat visit restored from browser back/forward cache is a new opening.
window.addEventListener('pageshow', event => {
  if (event.persisted) stampPageOpenTime();
});

</script>
