const keys=['plate','owner','joined','note'];
const limits={plate:20,owner:40,joined:40,note:300};
const params=new URLSearchParams(location.search);

function beijingTime(now){return new Date(now.getTime()+28800000).toISOString().slice(0,19).replace('T',' ')}
function tick(){const now=new Date();const t=beijingTime(now);document.querySelectorAll('.mark').forEach(el=>{el.replaceChildren();for(const text of [info.plate,t]){const line=document.createElement('div');line.textContent=text;el.append(line)}});const clock=document.getElementById('clock');clock.textContent=t;clock.dateTime=now.toISOString()}

document.getElementById('copy').onclick=async()=>{const field=document.getElementById('share');try{await navigator.clipboard.writeText(field.value);document.getElementById('status').textContent='链接已复制'}catch{field.focus();field.select();document.getElementById('status').textContent='请长按或使用 Ctrl+C 复制已选中的链接'}};
